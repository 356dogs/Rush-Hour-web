<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau des scores</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.4;
        }
    </style>
</head>
<body>
    <video autoplay muted loop class="video-bg">
        <source src="assets/redCarGIF.mp4" type="video/mp4">
    </video>
    
    <header>
        <div class="header-left">
            <img src="assets/INSA.png" alt="INSA Logo">
            <img src="assets/UPHF.png" alt="UPHF Logo">
        </div>
        <h1>🚗 Rush Hour Web</h1>
        <a href="index.html"><button class="nav-button">HOME</button></a>
    </header>

    <main>
        <div class="scoreboard-container">
            <h2>🏆 Meilleurs scores 🏆</h2>
            
            <table class="scores-table">
                <thead>
                    <tr>
                        <th>Rang</th>
                        <th>Pseudo</th>
                        <th>Score</th>
                        <th>Temps</th>
                        <th>Moves</th>
                        <th>Difficulté</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="scoresBody"></tbody>
            </table>
        </div>
    </main>

    <script>
        async function loadScores() {
            try {
                const res = await fetch('http://localhost:3000/api/scores');
                const scores = await res.json();
                
                const tbody = document.getElementById('scoresBody');
                tbody.innerHTML = '';

                scores.forEach((s, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${s.playerName}</td>
                        <td>${s.score}</td>
                        <td>${s.time}</td>
                        <td>${s.moves || '-'}</td>
                        <td>${s.difficulty}</td>
                        <td>${new Date(s.date).toLocaleDateString('fr-FR')}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (e) {
                console.error(e);
                document.getElementById('scoresBody').innerHTML = `
                    <tr><td colspan="7">Erreur de chargement des scores</td></tr>
                `;
            }
        }

        window.onload = loadScores;
    </script>
</body>
</html>
