<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rush Hour - Jeu</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <video autoplay muted loop class="video-bg">
        <source src="assets/redCarGIF.mp4" type="video/mp4">
    </video>

    <header>
        <div class="header-left">
            <a href="https://www.groupe-insa.fr/" target="_blank">
                <img src="assets/INSA.png" alt="INSA Logo">
            </a>
            <a href="https://www.uphf.fr/" target="_blank">
                <img src="assets/UPHF.png" alt="UPHF Logo">
            </a>
        </div>
        
        <h1>🚗 Rush Hour Web</h1>
        
        <div class="header-right">
            <a href="index.html"><button class="nav-button">HOME</button></a>
        </div>
    </header>

    <main>
        <div class="game-container">
            <div id="plateauDeJeu"></div>
            <aside class="statsJeu">
                <div class="stat-item">
                    <h3>Temps</h3>
                    <p id="timer">00:00</p>
                </div>
                <div class="stat-item">
                    <h3>Déplacements</h3>
                    <p id="moves">0</p>
                </div>
                <div class="stat-item">
                    <h3>Score</h3>
                    <p id="score">-</p>
                </div>
            </aside>
                <aside class="fin-jeu" id="finJeu" style="display:none;">
                    <h3>Bravo vous avez gagné. 🎉🎉</h3>
                    <h3>Entrez un nom pour sauvegarder votre score.</h3>
                    <form id="scoreForm">
                        <input id="playerName" name="playerName" type="text" placeholder="Votre nom" required />
                        <div style="display:flex;gap:8px;margin-top:12px;">
                            <button type="Sauvegarder">Enregistrer</button>
                            <button type="button" id="pasSauvegarder">Ne pas enregistrer</button>
                        </div>
                    </form>
                    <p id="saveStatus" style="margin-top:8px;color:#fff"></p>
                </aside>
        </div>
    </main>
    <script src="./js/Case.js"></script>
    <script src="./js/Vehicule.js"></script>
    <script src="./js/Plateau.js"></script>
    <script>
    grilleCustom1(vehicules);
    </script>
</body>
</html>
